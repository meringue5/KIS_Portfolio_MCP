name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run tests
        run: uv run pytest

      - name: Check architecture contract
        run: uv run python .agent/skills/kis-architecture-audit/scripts/check_architecture_contracts.py

      - name: Check MCP surface
        run: uv run python .agent/skills/kis-mcp-surface-audit/scripts/inspect_mcp_surface.py

      - name: Check shell scripts
        run: bash -n scripts/setup.sh

      - name: Check JSON examples
        run: python3 -m json.tool docs/examples/claude_desktop_config.example.json

      - name: Check whitespace
        run: git diff --check
