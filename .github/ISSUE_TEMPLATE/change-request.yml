name: Change request
description: 기존 동작의 개선, 요구 명확화 또는 새 결과를 제안합니다.
title: "[Change] "
labels:
  - change
body:
  - type: markdown
    attributes:
      value: |
        구현안보다 해결하려는 문제와 원하는 결과를 먼저 적습니다.
  - type: textarea
    id: problem
    attributes:
      label: 문제와 동기
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과와 인수 기준
    validations:
      required: true
  - type: textarea
    id: current_contract
    attributes:
      label: 현재 요구·결정과의 관계
      description: 새 요구인지, 모호성 보완인지, 승인된 요구의 구현인지 적습니다.
    validations:
      required: true
  - type: checkboxes
    id: possible_impacts
    attributes:
      label: 예상 영향
      options:
        - label: 공개 MCP/API 또는 OAuth scope
        - label: 데이터 SSOT, grain, retention 또는 migration
        - label: 보안·개인정보·secret
        - label: Cloud resource, 외부 provider 또는 월비용
        - label: SLO, backup, restore 또는 rollback
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
