query_policy = "exact run_id or exact pipeline_id list, mutually exclusive; public pipeline aliases resolve to canonical ids and the response reports requested_pipeline_id, resolved_pipeline_id, and alias_applied; list lookback default 7 maximum 31 days; request as_of is the inclusive cutoff, while envelope as_of is the latest returned finished_at/started_at when rows exist and otherwise the cutoff for a calendar-evaluated empty window; portfolio-refresh evaluates only fixed due KST slots inside the exact wall-clock window and excludes future slots; limit default 20 maximum 50; stable started_at,run_id ordering"
status_policy = "unavailable > failed > partial > stale > not_assessed > pass; window_status reports scheduled-slot coverage and does not summarize run success, so a failed run counts as observed while quality.status and each run status expose the failure; succeeded run or compatibility summary alone never proves overall pass; zero run rows pass only when complete governed market-calendar evidence proves no fixed portfolio slot was due; any due slot without run evidence is partial"
unavailable_policy = "Control query/session failure or incomplete calendar coverage returns unavailable and no cached or evidence-free empty green; unknown stages and error codes are redacted and prevent pass"
activation_state = "inactive"
max_response_bytes = 262144
max_page_size = 50
max_lookback_days = 31

