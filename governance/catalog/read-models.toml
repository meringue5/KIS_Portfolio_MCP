activation_state = "inactive"
max_response_bytes = 262144
max_page_size = 200
max_lookback_days = 31

[[contracts]]
id = "read_model.pipeline-run-v1"
version = "1.0.0"
status = "approved"
owner = "owner"
description = "logical pipeline run과 stage, quality, watermark, resume 상태를 bounded safe fields로 구성한 운영 projection."
decision_refs = ["DEC-031", "DEC-032", "DEC-038"]
input_dataset_ids = ["dataset.pipeline-run-evidence", "dataset.pipeline-stage-evidence", "dataset.data-quality-evidence", "dataset.data-lineage-evidence", "dataset.pipeline-watermark-state"]
registry_input_kinds = ["pipeline", "dataset"]
consumer_scope = "mcp-read"
response_schema_ref = "read-model-envelope-v1/pipeline-run-v1"
allowed_fields = ["schema_version", "as_of", "source", "freshness", "quality", "missing_coverage", "lineage_ref", "request_id", "data", "run_id", "pipeline_id", "pipeline_version", "definition_hash", "logical_date", "slot", "partition_ref", "execution_state", "overall_status", "source_calls_used", "source_call_budget", "stage_name", "stage_status", "first_failed_stage", "resumable_stage", "watermark_type", "watermark_status", "retry_eligible", "resume_eligible", "error_code"]
