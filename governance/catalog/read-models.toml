[[contracts]]
id = "read_model.pipeline-run-v1"
version = "1.2.1"
status = "approved"
owner = "owner"
description = "logical pipeline run과 stage, quality, watermark, resume 상태를 bounded safe fields로 구성한 운영 projection."
decision_refs = ["DEC-031", "DEC-032", "DEC-038", "DEC-059", "ADR-031"]
input_dataset_ids = ["dataset.pipeline-run-evidence", "dataset.pipeline-stage-evidence", "dataset.data-quality-evidence", "dataset.data-lineage-evidence", "dataset.pipeline-watermark-state", "dataset.market-calendar"]
registry_input_kinds = ["pipeline", "dataset"]
consumer_scope = "mcp-read"
response_schema_ref = "read-model-envelope-v1/pipeline-run-v1"
allowed_fields = ["schema_version", "as_of", "source", "freshness", "quality", "missing_coverage", "lineage_ref", "request_id", "data", "query", "requested_pipeline_id", "resolved_pipeline_id", "alias_applied", "window", "window_status", "expected_run_count", "observed_run_count", "missing_run_count", "run_id", "pipeline_id", "pipeline_version", "definition_hash", "logical_date", "slot", "partition_ref", "execution_state", "overall_status", "source_calls_used", "source_call_budget", "stage_name", "stage_status", "first_failed_stage", "resumable_stage", "watermark_type", "watermark_status", "retry_eligible", "resume_eligible", "error_code"]
