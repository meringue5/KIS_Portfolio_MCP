status = "approved"
owner = "owner"
description = "packaged governance manifest와 physical object registry의 bounded, sensitivity-filtered catalog projection."
decision_refs = ["DEC-031", "DEC-032", "DEC-038"]
input_dataset_ids = []
registry_input_kinds = ["source", "dataset", "metric", "pipeline", "macro_series", "object"]
consumer_scope = "mcp-read"
response_schema_ref = "read-model-envelope-v1/data-catalog-v1"
allowed_fields = ["schema_version", "as_of", "source", "freshness", "quality", "missing_coverage", "lineage_ref", "request_id", "data", "kind", "id", "version", "lifecycle", "owner", "purpose", "sensitivity", "contract_hash", "details_available", "layer", "grain", "natural_key", "time_semantics", "freshness_slo", "quality_rules", "backup_policy", "formula_ref", "unit", "point_in_time", "quality_gate", "input_dataset_ids", "output_dataset_ids", "stages", "schedule_policy", "trigger_policy", "activation_state", "concept", "region", "provider_series_id", "native_frequency", "native_unit", "seasonal_adjustment", "vintage_capability", "source_owner", "rights_note", "attribution", "qualified_name", "object_type", "key", "linked_dataset_id", "missing_contract_link"]
