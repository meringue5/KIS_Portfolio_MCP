[[contracts]]
id = "read_model.data-quality-v1"
version = "1.0.0"
status = "approved"
owner = "owner"
description = "MotherDuck Control evidence에서 구성한 bounded dataset quality, freshness, coverage와 safe lineage projection."
decision_refs = ["DEC-031", "DEC-032", "DEC-038"]
input_dataset_ids = ["dataset.pipeline-run-evidence", "dataset.pipeline-stage-evidence", "dataset.data-quality-evidence", "dataset.data-lineage-evidence", "dataset.pipeline-watermark-state"]
registry_input_kinds = ["dataset", "pipeline"]
consumer_scope = "mcp-read"
response_schema_ref = "read-model-envelope-v1/data-quality-v1"
allowed_fields = ["schema_version", "as_of", "source", "freshness", "quality", "missing_coverage", "lineage_ref", "request_id", "data", "dataset_id", "run_id", "rule_id", "status", "evaluated_at", "safe_value_class", "safe_value", "suppressed_detail", "gap_code", "gap_count"]
suppressed_fields = ["raw_json", "details", "observed_value", "expected_value", "error_message", "partition_key", "input_ref", "output_ref", "object_uri", "secret_profile", "auth_class", "cost_budget"]
query_policy = "exact dataset_id and optional exact run_id; lookback default 7 maximum 31 days; limit default 50 maximum 200; bound parameters and strictly validated opaque cursor"
