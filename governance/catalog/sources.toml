[[contracts]]
id = "source.kis-open-api"
version = "1.0.0"
status = "approved"
owner = "owner"
description = "한국투자증권 계좌·주문·체결·현금·시세·상품정보의 계좌 전용 원천. 현재 포트폴리오 사실의 canonical source이며 추정실적·투자의견·ETF 구성은 보조 관측으로만 사용한다."
decision_refs = ["DEC-005", "DEC-010", "DEC-011", "DEC-012", "DEC-013", "DEC-015", "DEC-018", "DEC-021", "DEC-023"]
provider = "Korea Investment & Securities"
canonical_role = "canonical"
access_method = "OAuth-protected REST API and official instrument master downloads"
