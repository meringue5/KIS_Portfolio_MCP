license_class = "account-private"
sensitivity = "confidential"
region = "KR"
cost_class = "routine"
rate_limit_policy = "docs/kis-api-rate-limits.md; production calls are serialized at a conservative 150 ms minimum interval and token issuance at 1 second"
availability_slo = "account and quote endpoints on demand; market-close daily facts after the relevant KR or US session; endpoint-specific lag and partial coverage must be surfaced"

