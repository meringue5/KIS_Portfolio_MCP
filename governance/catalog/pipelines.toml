version = "1.0.0"
status = "approved"
owner = "owner"
description = "승인된 거래·포지션·기업행사 사실을 account/instrument episode별로 재생해 lot state와 가역적 매도 배분을 만든다."
decision_refs = ["DEC-009", "DEC-010", "DEC-011", "DEC-012", "DEC-013", "DEC-014", "DEC-038", "DEC-041", "DEC-044"]
source_ids = []
input_dataset_ids = ["dataset.portfolio-position-observation", "dataset.trade-event", "dataset.corporate-action-event"]
output_dataset_ids = ["dataset.position-episode", "dataset.purchase-lot-state", "dataset.sell-allocation"]
stages = ["plan-boundaries", "replay", "allocate", "reconcile", "quality", "publish"]
schedule_policy = "WI-022 initial bounded reconstruction only; recurring incremental activation is outside S01 and requires a later runtime gate"
calendar_gate = "trade effective order and governed corporate-action effective sequence; unresolved same-time ordering is an exception"
idempotency_key = "pipeline id, version, source history cutoff, position cutoff and hashed account/instrument partition"
timeout_policy = "bounded account/instrument partitions with no source request or always-on service"
retry_policy = "reuse completed deterministic partition; append a new reconstruction revision only when governed inputs or contract version change"
source_call_budget = "zero; consumes governed MotherDuck inputs only"
freshness_gates = ["trade and position cutoffs are explicit", "corporate-action held-instrument coverage spans the reconstruction window"]
quality_gates = ["actual manual and inferred-opening provenance remain distinct", "known source gaps remain provisional", "missing corporate-action coverage is not_assessed", "negative residual ambiguous order and insufficient lots are reconciliation exceptions", "all published quantities reconcile or retain explicit blockers"]
secret_profile = "MotherDuck runtime only after production approval; pure S01 contract has no secret"
cost_class = "backfill"
trigger_policy = "repository-local fixture in S01 through S04; S05 is read-only dry-run and S06 requires explicit bounded production approval"

[[contracts]]
id = "pipeline.alert-evaluation-v2"
version = "1.2.0"
status = "approved"
owner = "owner"
description = "승인 metric contract를 point-in-time price/state에서 평가하고 immutable rule version, state transition과 DB-only shadow claim을 기록한다."
decision_refs = ["DEC-026", "DEC-027", "DEC-028", "DEC-030", "DEC-038", "DEC-041", "DEC-044", "DEC-049", "DEC-051", "DEC-052"]
source_ids = []
input_dataset_ids = ["dataset.instrument-master", "dataset.price-bar-daily", "dataset.metric-value", "dataset.portfolio-daily-state"]
output_dataset_ids = ["dataset.alert-candidate", "dataset.alert-delivery-ledger"]
stages = ["resolve-rule", "select-point-in-time-input", "evaluate", "quality", "transition", "claim-shadow"]
schedule_policy = "fixed V2 scale-to-zero jobs evaluate 10:00, 14:30 and 16:00 KST; kr-1000 also evaluates the exact prior U.S. close session"
calendar_gate = "inherits the governed portfolio state market session and quality status; U.S. close uses its exact session key once"
idempotency_key = "rule id/version, opaque subject, market session key and evaluation slot"
timeout_policy = "bounded held-subject shards in an existing scale-to-zero job"
retry_policy = "candidate replay is idempotent; state uses optimistic revision; expired or retryable shadow claims may be reacquired; unknown never auto-retries"
source_call_budget = "zero direct source or network calls; consumes governed MotherDuck values only"
freshness_gates = ["upstream metric and state cutoffs are terminal for the slot", "rule validity includes evaluation time"]
quality_gates = ["pass input quality only mutates state", "baseline-only first active observation creates state but no external delivery", "watch, warning or critical later transitions create delivery-required state", "downward cross requires previous close at or above previous SMA20 and current close below current SMA20", "KRX intraday volume is suppressed until same-slot normalization exists", "production-value public context has safe identity and decision-aligned percent facts", "unavailable governed analytics carry explicit reason codes", "public context allowlist and sensitive-value rejection", "ETF treated as opaque security with missing constituent coverage"]
secret_profile = "MotherDuck runtime only; no Telegram token or chat identifier in WI-028"
cost_class = "routine"
trigger_policy = "DB-only fixture and shadow claim contract; production threshold, external destination and Telegram send remain gated by WI-029 and WI-030"

[[contracts]]
id = "pipeline.signal-calibration-v2"
version = "1.0.0"
status = "approved"
owner = "owner"
description = "point-in-time 또는 명시적 reconstructed metric을 bounded replay하고 DB-only shadow와 owner approval evidence를 만든다."
decision_refs = ["DEC-026", "DEC-027", "DEC-028", "DEC-030", "DEC-038", "DEC-041", "DEC-044", "DEC-049"]
source_ids = []
input_dataset_ids = ["dataset.instrument-master", "dataset.price-bar-daily", "dataset.metric-value", "dataset.alert-candidate", "dataset.alert-delivery-ledger"]
output_dataset_ids = ["dataset.alert-calibration-evidence"]
stages = ["plan-window", "select-provenance", "replay", "calibrate-asset-class", "review-report", "observe-shadow", "approve-rule"]
schedule_policy = "one bounded up-to-three-year replay plus DB-only observation at the existing governed monitoring slots for at least fourteen elapsed days"
calendar_gate = "replay and shadow retain exact KR or U.S. market session identities; missing closed-session expectations are reconciled explicitly"
idempotency_key = "rule set id/version, replay or shadow window and evidence hash"
timeout_policy = "bounded MotherDuck-only shards; no provider request or always-on process"
retry_policy = "immutable replay hash is a no-op; shadow window recomputes from immutable candidates; owner decisions append revisions"
source_call_budget = "zero provider and Telegram calls"
freshness_gates = ["metric knowledge time does not exceed evaluation time", "shadow covers expected governed sessions and slots"]
quality_gates = ["three-year span and asset-class coverage explicit", "daily median and p95 alert budget", "owner-labelled false-positive and miss review", "zero external sends and sensitive violations", "ETF look-through remains unavailable"]
secret_profile = "MotherDuck runtime only; no Telegram token, destination or KIS source credential"
cost_class = "backfill"
trigger_policy = "manual bounded replay and existing Scheduler shadow slots; external transport is structurally unavailable until WI-030"

[[contracts]]
id = "pipeline.telegram-delivery-v2"
version = "1.3.0"
status = "approved"
owner = "owner"
description = "DEC-050 transport canary 증거를 보존하면서 DEC-051 production-value release candidate와 이후 permanent rule의 owner-approved alert transition을 redacted Telegram ledger로 전달한다."
decision_refs = ["DEC-006", "DEC-026", "DEC-027", "DEC-028", "DEC-030", "DEC-038", "DEC-041", "DEC-044", "DEC-050", "DEC-051", "DEC-052"]
source_ids = []
input_dataset_ids = ["dataset.alert-candidate", "dataset.alert-delivery-ledger", "dataset.alert-calibration-evidence"]
output_dataset_ids = ["dataset.alert-delivery-ledger"]
stages = ["verify-owner-approval", "render-production-value-payload", "redact", "claim", "send-message", "record-outcome"]
schedule_policy = "composed after the existing 10:00, 14:30 and 16:00 KST monitoring jobs; a canary rule is valid for at most seven elapsed days and U.S. close remains morning-only"
calendar_gate = "inherits the exact candidate evaluation slot and session; no independent delivery schedule"
idempotency_key = "candidate id, telegram channel and opaque destination reference"
timeout_policy = "one bounded HTTPS sendMessage request per acquired claim; post-send timeout is terminal unknown"
retry_policy = "no in-process retry; explicit provider 429/5xx may be retried by a later scheduled run only while the rule remains valid; terminal unknown and expired claims are never automatically retried"
source_call_budget = "at most 20 Telegram sendMessage attempts per monitoring run after all activation gates pass"
freshness_gates = ["candidate and delivery-required transition are terminal for the slot", "latest owner decision remains approved", "rule valid_from and valid_to contain dispatch time"]
quality_gates = ["active external rule only", "pass-quality candidate only", "watch or higher non-baseline transition only", "normal no-change and first-rule baseline remain DB evidence", "current SMA position actual cross and moving-average structure use distinct owner-readable terms", "intraday non-comparable volume and unavailable drawdown or contribution are explicit and never zero-filled", "allowlisted payload excludes account number absolute total assets credentials raw source and chat identifier", "disabled incomplete expired or revoked configuration creates no request"]
secret_profile = "GCP Secret Manager Telegram bot token and private chat id only on the V2 pipeline runtime identity; opaque destination alias is non-secret runtime config"
cost_class = "routine"
trigger_policy = "DEC-050 transport canary remains immutable evidence; DEC-051 permits one separately versioned production-value release candidate for real-use stabilization, while permanent external activation still requires verified WI-029 evidence and owner acceptance"
