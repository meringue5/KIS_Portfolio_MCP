schema_version = 1

[[contracts]]
id = "metric.portfolio-value-krw"
version = "1.0.0"
status = "approved"
owner = "owner"
description = "평가 slot의 quality-gated 계좌·종목·현금 가치를 합산한 원화 기준 포트폴리오 가치. Telegram payload에는 절대액을 노출하지 않는다."
decision_refs = ["DEC-005", "DEC-015", "DEC-026", "DEC-038", "DEC-044"]
input_dataset_ids = ["dataset.portfolio-daily-state"]
grain = "one portfolio subject, evaluation timestamp and slot"
formula_ref = "formula.portfolio-value-krw.v1"
unit = "KRW"
point_in_time = true
quality_gate = "all component rows pass and their effective and knowledge timestamps do not exceed the evaluation cutoff"
validation_policy = "Python Decimal golden fixture equals the governed SQL sum; future input and conflicting replay tests must fail"
consumer_ids = ["portfolio return denominator", "drawdown and risk budget", "signal evaluation"]

[[contracts]]
id = "metric.portfolio-return-modified-dietz"
version = "1.0.0"
status = "approved"
owner = "owner"
description = "인접한 quality-gated 포트폴리오 상태 사이의 외부 현금흐름 시점가중 Modified Dietz 수익률."
decision_refs = ["DEC-004", "DEC-009", "DEC-013", "DEC-015", "DEC-026", "DEC-038", "DEC-044"]
input_dataset_ids = ["dataset.portfolio-daily-state", "dataset.cash-transaction-event"]
grain = "one portfolio subject, prior-current governed evaluation pair and metric version"
formula_ref = "formula.portfolio-return-modified-dietz.v1"
unit = "ratio"
point_in_time = true
quality_gate = "both states pass with identical required account coverage; cash-event coverage and classifications span the period; denominator is non-zero; no future knowledge"
validation_policy = "independent DuckDB Decimal fixture equals Python formula to DECIMAL(38,10); zero denominator, missing coverage, unknown classification, unsupported FX and future revision fail closed"
consumer_ids = ["portfolio performance history", "chain-linked wealth", "drawdown", "signal evaluation"]

[[contracts]]
id = "metric.portfolio-component-contribution-modified-dietz"
version = "1.0.0"
status = "approved"
owner = "owner"
description = "계좌를 합산한 position 또는 cash 구성요소의 가치변화에서 배정된 외부 현금흐름을 뺀 금액을 포트폴리오 Dietz denominator로 나눈 수익률 기여도."
decision_refs = ["DEC-009", "DEC-013", "DEC-015", "DEC-026", "DEC-038", "DEC-044"]
input_dataset_ids = ["dataset.portfolio-daily-state", "dataset.cash-transaction-event"]
grain = "one consolidated portfolio component, prior-current governed evaluation pair and metric version"
formula_ref = "formula.portfolio-component-contribution-modified-dietz.v1"
unit = "ratio"
point_in_time = true
quality_gate = "portfolio return gate passes and every external cash flow is assigned only to its matching cash-currency component"
validation_policy = "component contributions plus the explicit residual equal the portfolio Modified Dietz return within 0.0000000001; identity and account coverage changes remain non-pass"
consumer_ids = ["portfolio performance history", "contribution-aware signal evaluation"]

[[contracts]]
