schema_version = "1.0.0"
v2_tools = [
  "get-portfolio-overview", "get-position-analysis", "get-performance-history",
  "get-market-snapshot", "get-market-history", "get-trade-ledger", "get-trade-thread",
  "get-dividend-summary", "get-fundamental-outlook", "get-exposure-analysis",
  "get-signal-status", "get-data-catalog", "get-data-quality", "get-pipeline-run",
  "get-journal-review-queue", "run-managed-pipeline", "upsert-trade-journal",
  "revise-trade-thread",
]

[[mappings]]
v1_tool = "get-configured-accounts"
v2_tools = ["get-portfolio-overview"]
disposition = "consolidated"
reason_code = "account_alias_projection"
guidance = "Use get-portfolio-overview; accounts are exposed by alias with masked metadata."

